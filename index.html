<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PLAY</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<div class="app">

    <header class="header">
        <div class="logo">
            <span>PLAY</span>
        </div>

        <div class="header-icons">
            <button class="search-btn">
                <span class="search-icon"></span>
            </button>

            <button class="menu-btn">
                <span></span>
                <span></span>
                <span></span>
            </button>
        </div>
    </header>

    <main class="videos">

        <article class="video-card">
            <img src="images/" class="thumbnail">

            <div class="video-info">
                <img src="images/" class="avatar">

                <div class="details">
                    <h2>Building a multi million dollar developer product | Dhiwise</h2>

                    <p class="meta">
                        100K Views <span>•</span> 18 hours ago
                    </p>

                    <p class="author">Arnau Ros</p>
                </div>
            </div>
        </article>

        <article class="video-card">
            <img src="images/" class="thumbnail">

            <div class="video-info">
                <img src="images/" class="avatar">

                <div class="details">
                    <h2>Google and Pieces dropped some interesting updates</h2>

                    <p class="meta">
                        100K Views <span>•</span> 18 hours ago
                    </p>

                    <p class="author">Arnau Ros</p>
                </div>
            </div>
        </article>

        <article class="video-card">
            <img src="images/" class="thumbnail">

            <div class="video-info">
                <img src="images/" class="avatar">

                <div class="details">
                    <h2>How does a browser work? | Engineering side</h2>

                    <p class="meta">
                        100K Views <span>•</span> 18 hours ago
                    </p>

                    <p class="author">Arnau Ros</p>
                </div>
            </div>
        </article>

    </main>

    <nav class="bottom-nav">

        <button class="nav-item active" data-page="Home">
            <span class="home-icon"></span>
            <strong>Home</strong>
        </button>

        <button class="nav-item" data-page="History">
            <span class="history-icon"></span>
            <strong>History</strong>
        </button>

        <button class="nav-item" data-page="Collection">
            <span class="collection-icon"></span>
            <strong>Collection</strong>
        </button>

        <button class="nav-item" data-page="Subscribers">
            <span class="user-icon"></span>
            <strong>Subscribers</strong>
        </button>

    </nav>

</div>

<script src="script.js"></script>

</body>
</html>
